# refresh.yml — runs the data pipeline every 6 hours automatically.
#
# What this does:
#   GitHub's servers run this workflow on a schedule, completely
#   independently of your Mac. It fetches new prices from Yahoo Finance,
#   loads them into BigQuery, and rebuilds the dbt models.
#   After this runs, anyone visiting the Streamlit dashboard sees fresh data.
#
# Schedule: every 6 hours at :00 (00:00, 06:00, 12:00, 18:00 UTC)

name: Refresh Market Data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # also allows manual trigger from GitHub UI

permissions:
  contents: write   # needed to push dbt docs to gh-pages branch

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET:     ${{ secrets.BQ_DATASET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > ${{ github.workspace }}/gcp-key.json

      - name: Fetch latest prices into BigQuery
        run: uv run data_pipeline/fetch_prices.py

      - name: Fetch fundamentals and analyst ratings
        run: uv run data_pipeline/fetch_fundamentals.py

      - name: Create dbt profiles.yml from secrets
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          financial_markets:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: ${{ secrets.BQ_DATASET }}
                keyfile: ${{ github.workspace }}/gcp-key.json
                location: EU
                threads: 4
          EOF

      - name: Run dbt models
        working-directory: dbt_project
        run: uv run dbt run

      - name: Run dbt tests
        working-directory: dbt_project
        run: uv run dbt test

      - name: Generate dbt docs
        working-directory: dbt_project
        run: uv run dbt docs generate

      - name: Deploy dbt docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dbt_project/target
          destination_dir: dbt-docs

      - name: Check for price alerts (>5% daily move)
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: uv run data_pipeline/price_alerts.py

      - name: Remove GCP service account key
        if: always()
        run: rm -f ${{ github.workspace }}/gcp-key.json
