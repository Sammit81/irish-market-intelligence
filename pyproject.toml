[project]
name = "financial-markets-analytics"
version = "0.1.0"
description = "Live financial markets dashboard: yfinance → Snowflake → dbt → Streamlit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "snowflake-connector-python[pandas]>=3.0.0",
    "dbt-snowflake>=1.8.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "python-dotenv>=1.2.1",
    "scipy>=1.11.0",
]
