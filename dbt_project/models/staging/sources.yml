# sources.yml — tells dbt where the raw data lives.
# The source() function in SQL models references this file.

version: 2

sources:
  - name: raw
    schema: "{{ env_var('BQ_DATASET') }}"
    tables:
      - name: RAW_PRICES
        description: "Raw OHLCV price data fetched from Yahoo Finance via yfinance"
        columns:
          - name: TICKER
            description: "Yahoo Finance ticker symbol"
          - name: PRICE_DATE
            description: "Trading date"
          - name: CLOSE
            description: "Adjusted closing price"
      - name: RAW_FUNDAMENTALS
        description: "Raw company fundamentals and analyst ratings fetched from Yahoo Finance"
        columns:
          - name: TICKER
            description: "Yahoo Finance ticker symbol"
          - name: FETCH_DATE
            description: "Date fundamentals were fetched"
